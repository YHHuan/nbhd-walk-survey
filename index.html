<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>台灣成人日常移動與鄰里探索調查</title>
<meta name="description" content="一份關於日常走路與鄰里探索習慣的匿名問卷，約 5–7 分鐘。">
<meta name="robots" content="noindex">

<style>
  :root{
    --bg:#FBF7F0;          /* 溫暖米白 */
    --card:#FFFFFF;
    --ink:#2E3A2F;         /* 深墨綠灰，比純黑柔和 */
    --ink-soft:#61705F;
    --line:#E6DFD3;
    --brand:#6E8B5B;       /* 苔綠 */
    --brand-dark:#57724A;
    --brand-wash:#EEF3E8;
    --accent:#D98E5F;      /* 暖陶土 */
    --accent-wash:#FBEFE4;
    --flower-pink:#E8A0A8; /* 步道小花點綴 */
    --warn:#B4553B;
    --radius:16px;
    --radius-sm:12px;
    --shadow:0 1px 2px rgba(46,58,47,.05), 0 8px 24px rgba(46,58,47,.06);
    --maxw:640px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1B211C; --card:#242C25; --ink:#EDEBE4; --ink-soft:#A9B4A6;
      --line:#39443A; --brand:#9DBE86; --brand-dark:#B6D2A1; --brand-wash:#2C382C;
      --accent:#E5A87C; --accent-wash:#3A2E25; --warn:#E5927A;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Helvetica Neue",system-ui,sans-serif,
                "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji";
    font-size:17px; line-height:1.75;
    -webkit-text-size-adjust:100%;
    padding-bottom:env(safe-area-inset-bottom);
  }
  /* ---------- 進度列 ---------- */
  .topbar{
    position:sticky; top:0; z-index:50; background:color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter:saturate(150%) blur(8px); border-bottom:1px solid var(--line);
  }
  .topbar-inner{max-width:var(--maxw); margin:0 auto; padding:10px 20px 12px}
  .topbar-row{display:flex; justify-content:space-between; align-items:baseline; gap:12px; min-width:0}
  .topbar-title{font-size:14px; font-weight:600; color:var(--ink-soft); letter-spacing:.01em; min-width:0}
  .topbar-step{flex:0 0 auto; font-size:13px; color:var(--ink-soft); font-variant-numeric:tabular-nums; white-space:nowrap}
  .trail-progress{height:50px; margin-top:3px; color:var(--ink); min-width:0}
  .trail-svg{display:block; width:100%; height:50px; overflow:visible}
  .trail-base,.trail-walked{fill:none; stroke-linecap:round; stroke-linejoin:round}
  .trail-base{stroke:var(--line); stroke-width:9}
  .trail-walked{stroke:var(--accent); stroke-width:9; stroke-dasharray:100; stroke-dashoffset:100;
                transition:stroke-dashoffset .4s cubic-bezier(.4,0,.2,1)}
  .trail-edge{fill:none; stroke:color-mix(in srgb,var(--card) 52%,transparent); stroke-width:1.5;
              stroke-linecap:round; stroke-dasharray:2 7; opacity:.72}
  .trail-walker{color:var(--ink); transition:transform .4s cubic-bezier(.4,0,.2,1)}
  .trail-walker-shape{fill:none; stroke:currentColor; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round;
                      vector-effect:non-scaling-stroke}
  .trail-walker-head{fill:var(--ink); stroke:none}
  .trail-flower-position{pointer-events:none}
  .trail-flower-bloom{transform-box:fill-box; transform-origin:center}
  .trail-flower-bloom.is-new{animation:flower-bloom .25s ease-out both}
  @keyframes flower-bloom{from{opacity:0; transform:scale(.25)} to{opacity:1; transform:scale(1)}}
  /* ---------- 版面 ---------- */
  main{max-width:var(--maxw); margin:0 auto; padding:24px 20px calc(150px + env(safe-area-inset-bottom))}
  .page{min-width:0}
  @keyframes rise{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
  .page.page-enter>h2,.page.page-enter>.note,.page.page-enter>.repeat-device-card{
    animation:rise .28s cubic-bezier(.2,.7,.3,1) both
  }
  .page.page-enter .q{
    animation:rise .3s cubic-bezier(.2,.7,.3,1) both;
    animation-delay:calc(var(--card-order, 0) * 40ms)
  }
  h1{font-size:26px; line-height:1.4; margin:8px 0 6px; letter-spacing:-.01em}
  h2{font-size:21px; line-height:1.45; margin:4px 0 4px; letter-spacing:-.01em}
  .sub{color:var(--ink-soft); font-size:15px; margin:0 0 20px}
  .note{
    background:var(--brand-wash); border-radius:var(--radius-sm); padding:14px 16px;
    font-size:15px; color:var(--ink); margin:0 0 22px; border:1px solid color-mix(in srgb,var(--brand) 18%, transparent);
  }
  .note strong{color:var(--brand-dark)}
  .repeat-device-card{
    background:var(--accent-wash); border:1px solid color-mix(in srgb,var(--accent) 38%,var(--line));
    border-radius:var(--radius); padding:18px; margin:0 0 20px; box-shadow:var(--shadow)
  }
  .repeat-device-card p{margin:0; font-size:15.5px; line-height:1.75}
  .repeat-device-actions{display:flex; flex-wrap:wrap; gap:10px; margin-top:14px}
  .repeat-device-actions .btn-primary,.repeat-device-actions .btn-ghost{flex:1 1 180px; min-height:48px; padding:11px 18px}
  /* ---------- 題目卡 ---------- */
  .q{min-width:0; background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
     padding:20px 18px; margin:0 0 16px; box-shadow:var(--shadow);
     transition:border-color .35s, box-shadow .35s, background-color .35s}
  .q-stem{font-size:17px; font-weight:600; line-height:1.6; margin:0 0 4px}
  .q-help{font-size:14px; color:var(--ink-soft); margin:2px 0 12px}
  .q-optional{display:inline-block; font-size:12px; font-weight:600; color:var(--ink-soft);
     background:var(--bg); border:1px solid var(--line); border-radius:99px; padding:1px 9px; margin-left:6px; vertical-align:2px}
  .q.invalid{border-color:var(--warn); box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 14%, transparent)}
  .q.advance-target{border-color:color-mix(in srgb,var(--brand) 48%, var(--line));
     box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 10%, transparent), var(--shadow)}
  .err{color:var(--warn); font-size:14px; margin-top:8px; display:none}
  .q.invalid .err{display:block}
  /* ---------- 選項 ---------- */
  .opts{display:flex; flex-direction:column; gap:8px; margin-top:12px; min-width:0}
  .opt{display:flex; align-items:flex-start; gap:12px; padding:13px 14px; border:1.5px solid var(--line);
       border-radius:var(--radius-sm); cursor:pointer; background:var(--card); color:var(--ink);
       transition:border-color .15s, background .15s;
       min-width:0; min-height:48px}
  .opt:hover{border-color:color-mix(in srgb,var(--brand) 45%, var(--line))}
  .opt input{position:absolute; opacity:0; pointer-events:none}
  .dot{flex:0 0 auto; width:22px; height:22px; border:2px solid var(--line); border-radius:50%;
       margin-top:2px; display:grid; place-items:center; transition:border-color .15s, background-color .15s}
  .opt.multi .dot{border-radius:7px}
  .dot::after{content:""; width:9px; height:5px; border-left:2px solid var(--card); border-bottom:2px solid var(--card);
              opacity:0; transform:translateY(-1px) rotate(-45deg) scale(.55);
              transition:opacity .14s ease-out, transform .14s ease-out}
  .opt.on{border-color:var(--brand); background:var(--brand-wash)}
  .opt.on .dot{border-color:var(--brand); background:var(--brand)}
  .opt.on .dot::after{opacity:1; transform:translateY(-1px) rotate(-45deg) scale(1)}
  .option-icon{flex:0 0 24px; width:24px; height:24px; margin-top:1px; color:inherit}
  .option-icon *{vector-effect:non-scaling-stroke}
  .opt-label{flex:1 1 auto; min-width:0; font-size:16px; line-height:1.5; overflow-wrap:anywhere; word-break:break-word}
  .opt:focus-within{outline:2px solid var(--brand); outline-offset:2px}
  .opt.just-selected,.chip.just-selected{animation:option-pop .18s ease-out both}
  @keyframes option-pop{50%{transform:scale(1.02)} to{transform:scale(1)}}
  .opt.just-selected .dot::after{animation:check-in .14s ease-out both}
  @keyframes check-in{from{opacity:0; transform:translateY(-1px) rotate(-45deg) scale(.55)}
                      to{opacity:1; transform:translateY(-1px) rotate(-45deg) scale(1)}}
  /* ---------- 矩陣（手機上拆成一列一卡） ---------- */
  .mrow{min-width:0; padding:14px 0; border-top:1px solid var(--line); border-radius:10px;
        transition:background-color .35s, box-shadow .35s}
  .mrow:first-of-type{border-top:none; padding-top:6px}
  .mrow.advance-target{background:color-mix(in srgb,var(--brand-wash) 70%, transparent);
        box-shadow:0 0 0 5px color-mix(in srgb,var(--brand) 8%, transparent)}
  .mrow-label{min-width:0; font-size:16px; line-height:1.55; margin-bottom:10px; overflow-wrap:anywhere}
  .chips{display:flex; flex-wrap:wrap; gap:7px; min-width:0}
  .chip{border:1.5px solid var(--line); background:var(--card); border-radius:99px; padding:8px 14px;
        max-width:100%; min-width:0; min-height:44px; white-space:normal; overflow-wrap:anywhere; word-break:break-word;
        font-size:14.5px; line-height:1.45; cursor:pointer; color:var(--ink); transition:all .15s}
  .chip:hover{border-color:color-mix(in srgb,var(--brand) 45%, var(--line))}
  .chip.on{background:var(--brand); border-color:var(--brand); color:#fff; font-weight:600}
  .chip.on::before{content:"✓"; display:inline-block; margin-right:5px; opacity:1}
  .chip.just-selected::before{animation:chip-check-in .14s ease-out both}
  @keyframes chip-check-in{from{opacity:0} to{opacity:1}}
  @media (prefers-color-scheme: dark){ .chip.on{color:#1B211C} }
  /* ---------- 數字 / 文字 ---------- */
  .field{display:flex; align-items:center; gap:10px; margin-top:12px; min-width:0}
  input[type=number], input[type=text], input[type=date], select, textarea{
    font:inherit; font-size:16px; color:var(--ink); background:var(--card);
    border:1.5px solid var(--line); border-radius:var(--radius-sm); padding:12px 14px; width:100%; max-width:100%; min-width:0;
    -webkit-appearance:none; appearance:none;
  }
  input[type=number]{font-variant-numeric:tabular-nums; -moz-appearance:textfield; appearance:textfield}
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none; margin:0}
  input[type=date]{min-height:52px; -webkit-appearance:auto; appearance:auto}
  input[type=date]::-webkit-date-and-time-value{text-align:left}
  .field>input, .field>select, .field>textarea{flex:1 1 0; width:auto}
  input:focus, select:focus, textarea:focus{outline:none; border-color:var(--brand); box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 16%, transparent)}
  .unit{color:var(--ink-soft); font-size:15px; white-space:nowrap}
  textarea{min-height:96px; resize:vertical; line-height:1.6}
  select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9'><path d='M1 1l6 6 6-6' fill='none' stroke='%2361705F' stroke-width='2'/></svg>");
         background-repeat:no-repeat; background-position:right 14px center; padding-right:38px}
  .ngroup{display:flex; flex-direction:column; gap:0; margin-top:12px; min-width:0}
  .ngroup-row{display:flex; align-items:center; gap:12px; flex-wrap:wrap; min-width:0}
  .ngroup-label{flex:1 1 220px; min-width:0; font-size:15.5px; line-height:1.5; overflow-wrap:anywhere}
  .ngroup-row>input{flex:0 0 96px; width:96px; text-align:center}
  /* ---------- 滑桿（僅 questionnaire 指定的概略數字題） ---------- */
  .slider-widget{min-width:0; margin-top:12px; padding:14px; border:1px solid var(--line);
                 border-radius:var(--radius-sm); background:var(--bg)}
  .slider-head{display:flex; align-items:center; justify-content:space-between; gap:12px; min-width:0}
  .slider-readout{display:flex; align-items:baseline; gap:7px; min-width:0; color:var(--brand-dark)}
  .slider-value{font-size:34px; line-height:1; font-weight:750; font-variant-numeric:tabular-nums; letter-spacing:-.02em}
  .slider-value.is-empty{color:var(--ink-soft)}
  .slider-readout .unit{font-size:14px}
  .slider-direct-toggle{flex:0 0 auto; min-height:36px; padding:6px 11px; border:1px solid var(--line);
                        background:var(--card); color:var(--ink-soft); font-size:13px; font-weight:600}
  .slider-direct-toggle:hover{border-color:var(--brand); color:var(--brand-dark)}
  .slider-control{margin-top:12px; padding:0 4px}
  .range-slider{--range-progress:0%; --thumb-opacity:0; display:block; width:100%; height:44px; margin:0;
                padding:0; border:0; border-radius:99px; background:transparent; cursor:pointer;
                -webkit-appearance:none; appearance:none; touch-action:pan-y}
  .range-slider::-webkit-slider-runnable-track{
    width:100%; height:10px; border-radius:99px;
    background:linear-gradient(90deg,var(--accent) 0 var(--range-progress),var(--line) var(--range-progress) 100%)
  }
  .range-slider::-webkit-slider-thumb{
    width:32px; height:32px; margin-top:-11px; border:3px solid var(--card); border-radius:50%;
    background:var(--brand); box-shadow:0 1px 5px rgba(46,58,47,.28); opacity:var(--thumb-opacity);
    -webkit-appearance:none; appearance:none; transition:opacity .12s, transform .12s
  }
  .range-slider::-moz-range-track{
    width:100%; height:10px; border:0; border-radius:99px;
    background:linear-gradient(90deg,var(--accent) 0 var(--range-progress),var(--line) var(--range-progress) 100%)
  }
  .range-slider::-moz-range-thumb{
    width:32px; height:32px; border:3px solid var(--card); border-radius:50%;
    background:var(--brand); box-shadow:0 1px 5px rgba(46,58,47,.28); opacity:var(--thumb-opacity);
    transition:opacity .12s, transform .12s
  }
  .range-slider.is-set{--thumb-opacity:1}
  .range-slider:focus-visible{outline:2px solid var(--brand); outline-offset:3px}
  .range-slider:active::-webkit-slider-thumb{transform:scale(1.08)}
  .range-slider:active::-moz-range-thumb{transform:scale(1.08)}
  .slider-bounds{display:flex; justify-content:space-between; margin-top:-2px; color:var(--ink-soft);
                 font-size:12px; font-variant-numeric:tabular-nums}
  .slider-direct{display:flex; align-items:center; gap:9px; margin-top:12px; padding-top:12px; border-top:1px dashed var(--line)}
  .slider-direct input{flex:0 1 132px; width:132px; text-align:center}
  .slider-utilities{display:flex; justify-content:flex-end; margin-top:2px}
  .ngroup-row.has-slider{display:block; padding:18px 0; border-top:1px solid var(--line)}
  .ngroup-row.has-slider:first-child{padding-top:0; border-top:0}
  .ngroup-row.has-slider .slider-widget{margin-top:0; padding:0; border:0; background:transparent}
  .slider-head--group{align-items:flex-start}
  .slider-head--group .ngroup-label{flex:1 1 auto}
  .slider-head--group .slider-readout{flex:0 0 auto; justify-content:flex-end; white-space:nowrap}
  .slider-head--group .slider-value{font-size:23px; line-height:1.2}
  /* ---------- 七日步數 ---------- */
  .steps-lookup{font-size:14px; line-height:1.65; color:var(--ink-soft); margin:12px 0 10px; overflow-wrap:anywhere}
  .steps{display:flex; flex-direction:column; gap:9px; min-width:0}
  .steprow{display:flex; align-items:center; gap:12px; background:var(--bg); border:1px solid var(--line);
           border-radius:var(--radius-sm); padding:9px 12px; min-width:0}
  .steprow.weekend{background:var(--accent-wash); border-color:color-mix(in srgb,var(--accent) 30%, transparent)}
  .stepdate{flex:0 0 88px; font-size:15px; color:var(--ink-soft); font-variant-numeric:tabular-nums}
  .steprow input{flex:1 1 0; width:auto; min-width:0; text-align:right; background:var(--card)}
  .stepunit{flex:0 0 auto; color:var(--ink-soft); font-size:14px}
  .steptip{font-size:14px; color:var(--ink-soft); margin-top:12px; padding-left:2px}
  .q[data-type="steps7"]{position:relative}
  .q[data-type="steps7"] .q-stem{padding-right:76px}
  .steps-complete-badge{position:absolute; top:16px; right:16px; padding:4px 9px; border-radius:99px;
                        background:var(--brand); color:#fff; font-size:12px; font-weight:750;
                        font-variant-numeric:tabular-nums; line-height:1.4; opacity:0; transform:scale(.8);
                        pointer-events:none; transition:opacity .16s, transform .16s}
  .steps-complete-badge.is-visible{opacity:1; transform:scale(1)}
  @media (prefers-color-scheme: dark){.steps-complete-badge{color:#1B211C}}
  /* ---------- 同意 ---------- */
  .consent-body{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
                padding:20px 18px; font-size:15.5px; line-height:1.8; box-shadow:var(--shadow)}
  .consent-body p{margin:0 0 12px}
  .consent-body p:last-child{margin-bottom:0}
  .consent-body strong{color:var(--brand-dark)}
  @media (prefers-color-scheme: dark){ .consent-body strong{color:var(--brand)} }
  /* ---------- 底部操作列 ---------- */
  .nav{position:fixed; left:0; right:0; bottom:0; z-index:60;
       background:color-mix(in srgb, var(--bg) 94%, transparent); backdrop-filter:blur(10px);
       border-top:1px solid var(--line); padding:12px 20px calc(12px + env(safe-area-inset-bottom))}
  .nav-inner{max-width:var(--maxw); margin:0 auto; display:flex; gap:12px; align-items:center}
  button{font:inherit; cursor:pointer; border-radius:99px; border:none; transition:transform .1s, background .15s}
  button:active{transform:scale(.985)}
  .btn-primary{flex:1 1 auto; display:inline-flex; align-items:center; justify-content:center; gap:9px;
               background:var(--brand); color:#fff; font-size:17px; font-weight:600; padding:15px 24px; min-height:52px}
  .btn-primary:hover{background:var(--brand-dark)}
  .btn-primary[disabled]{background:var(--line); color:var(--ink-soft); cursor:not-allowed}
  .btn-primary.auto-pulse,.btn-primary.ready-pulse{animation:gentle-pulse .35s ease-out both}
  @keyframes gentle-pulse{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--brand) 14%, transparent); transform:scale(1.012)}}
  @media (prefers-color-scheme: dark){ .btn-primary{color:#1B211C} }
  .btn-ghost{flex:0 0 auto; display:inline-flex; align-items:center; justify-content:center; gap:7px;
             background:transparent; color:var(--ink-soft); border:1.5px solid var(--line);
             padding:14px 20px; font-size:16px; min-height:52px}
  .btn-ghost:hover{border-color:var(--brand); color:var(--brand)}
  .btn-icon{width:20px; height:20px; flex:0 0 20px}
  .saved{font-size:13px; color:var(--ink-soft); text-align:center; margin-top:8px; height:18px; opacity:0; transition:opacity .3s}
  .saved.show{opacity:1}
  /* ---------- 結束頁 ---------- */
  .done{text-align:center; padding:32px 4px}
  .done .mark{width:76px; height:76px; margin:0 auto 20px; border-radius:50%; background:var(--brand-wash);
              display:grid; place-items:center; border:2px solid var(--brand)}
  .done .mark svg{width:36px; height:36px}
  .prize{background:var(--accent-wash); border:1px solid color-mix(in srgb,var(--accent) 32%, transparent);
         border-radius:var(--radius); padding:20px 18px; margin:24px 0; text-align:left}
  .prize h3{margin:0 0 8px; font-size:17px}
  .prize p{margin:0 0 14px; font-size:15px; color:var(--ink-soft)}
  .btn-lottery{display:inline-block; background:var(--accent); color:#fff; text-decoration:none;
               border-radius:99px; padding:14px 26px; font-weight:600; font-size:16px}
  @media (prefers-color-scheme: dark){ .btn-lottery{color:#1B211C} }
  .lottery-config-warning{margin:24px 0; padding:18px; border:2px dashed var(--warn);
                          border-radius:var(--radius); background:color-mix(in srgb,var(--warn) 10%,var(--card));
                          color:var(--warn); text-align:left; font-size:14px; line-height:1.7; overflow-wrap:anywhere}
  .lottery-config-warning p{margin:0}
  .lottery-config-warning code{padding:2px 5px; border:1px solid color-mix(in srgb,var(--warn) 35%,var(--line));
                               border-radius:5px; background:var(--card); color:var(--ink);
                               font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:.9em}
  .fineprint{font-size:13.5px; color:var(--ink-soft); line-height:1.7; margin-top:24px}
  .debug{margin-top:28px; font-size:13px}
  .debug summary{cursor:pointer; color:var(--ink-soft)}
  .debug pre{background:var(--card); border:1px solid var(--line); border-radius:var(--radius-sm);
             padding:12px; overflow:auto; max-height:320px; font-size:12px; line-height:1.5}
  /* ---------- 填答結果卡 ---------- */
  .result-card{min-width:0; background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
               padding:22px 18px; margin:0 0 26px; text-align:left; box-shadow:var(--shadow)}
  .result-character{text-align:center}
  .result-art-stage{display:grid; place-items:center; width:min(100%,390px); aspect-ratio:4/3; margin:0 auto 16px;
                    overflow:hidden; border:1px solid color-mix(in srgb,var(--brand) 24%,var(--line));
                    border-radius:calc(var(--radius) + 6px); background:var(--brand-wash)}
  .character-art{display:block; width:100%; height:100%; color:var(--ink)}

/* 公開 SPEC 會濾掉呈現欄位，因此以核准變項作 fallback；精確步數有獨立 deny-list。 */
const SLIDER_WIDGET_FALLBACK = new Set([
  'age','play_months','play_days_7d','dog_walk_days',
  'godin_strenuous','godin_moderate','godin_light'
]);
const EXACT_NUMBER_VARS = new Set([
  'steps_d1','steps_d2','steps_d3','steps_d4','steps_d5','steps_d6','steps_d7',
  'event_day_steps','control_day_steps'
]);
function sliderVariable(item, field = null){
  const variable = field?.code || item?.var || '';
  if(item?.type === 'steps7' || EXACT_NUMBER_VARS.has(variable)) return false;
  return item?.widget === 'slider' || field?.widget === 'slider' || SLIDER_WIDGET_FALLBACK.has(variable);
}

const STORE_KEY = 'nbhd_survey_v' + (SPEC?.meta?.spec_version || '1');
const SUBMITTED_KEY = 'nbhd_survey_submitted_v1';

function readSubmittedDate(){
  try{
    const value = localStorage.getItem(SUBMITTED_KEY);
    return /^\d{4}-\d{2}-\d{2}$/.test(value || '') ? value : '';
  }catch(e){ return ''; }
}
function rememberSubmittedDate(date){
  try{ localStorage.setItem(SUBMITTED_KEY, date); }catch(e){}
}
function clearDraft(){
  try{ localStorage.removeItem(STORE_KEY); }catch(e){}
}

const AUTO_ADVANCE_DELAY = 350;
let autoAdvanceTimer = null;
let advanceHighlightTimer = null;
let trailFlowerState = {count:null, segments:null};

function pointOnTrail(fraction){
  const path = document.getElementById('trailPath');
  const safeFraction = Math.max(0, Math.min(1, Number(fraction) || 0));
  if(path && typeof path.getTotalLength === 'function' && typeof path.getPointAtLength === 'function'){
    const length = path.getTotalLength();
    return path.getPointAtLength(length * safeFraction);
  }
  return {x:12 + (548-12)*safeFraction, y:31};
}
function trailFlowerMarkup(point, index, isNew){
  const colors = ['var(--brand)','var(--accent)','var(--flower-pink)'];
  const color = colors[index % colors.length];
  const petals = Array.from({length:5},(_,petalIndex)=>{
    const angle = (-90 + petalIndex*72) * Math.PI / 180;
    const cx = (Math.cos(angle)*3.2).toFixed(2);
    const cy = (Math.sin(angle)*3.2).toFixed(2);
    return `<circle cx="${cx}" cy="${cy}" r="2.15" fill="${color}"></circle>`;
  }).join('');
  const yOffset = index % 2 === 0 ? -7 : 7;
  return `<g class="trail-flower-position" transform="translate(${point.x.toFixed(2)} ${(point.y+yOffset).toFixed(2)})">
    <g class="trail-flower-bloom${isNew?' is-new':''}">${petals}<circle r="1.35" fill="var(--card)"></circle></g>
  </g>`;
}
function setTrailProgress(fraction, segments, flowerCount, animateFlowers = true){
  const safeFraction = Math.max(0, Math.min(1, Number(fraction) || 0));
  const safeSegments = Math.max(1, Math.floor(Number(segments) || 1));
  const safeFlowerCount = Math.max(0, Math.min(safeSegments, Math.floor(Number(flowerCount) || 0)));
  const walked = document.getElementById('trailWalked');
  if(walked) walked.style.strokeDashoffset = String(100 - safeFraction*100);

  const walkerPoint = pointOnTrail(safeFraction);
  const walker = document.getElementById('trailWalker');
  if(walker) walker.style.transform = `translate(${walkerPoint.x.toFixed(2)}px,${walkerPoint.y.toFixed(2)}px)`;

  const flowers = document.getElementById('trailFlowers');
  const changed = trailFlowerState.count !== safeFlowerCount || trailFlowerState.segments !== safeSegments;
  if(flowers && changed){
    const isForwardStep = animateFlowers && trailFlowerState.count !== null &&
      trailFlowerState.segments === safeSegments && safeFlowerCount > trailFlowerState.count;
    flowers.innerHTML = Array.from({length:safeFlowerCount},(_,index)=>{
      const point = pointOnTrail((index+.5)/safeSegments);
      const isNew = isForwardStep && index >= trailFlowerState.count;
      return trailFlowerMarkup(point,index,isNew);
    }).join('');
  }
  trailFlowerState = {count:safeFlowerCount, segments:safeSegments};

  const progress = document.getElementById('trailProgress');
  if(progress){
    progress.setAttribute('aria-valuenow', String(Math.round(safeFraction*100)));
    progress.setAttribute('aria-label', `問卷進度 ${Math.round(safeFraction*100)}%`);
  }
}

function localISO(date){
  return date.getFullYear() + '-' + String(date.getMonth()+1).padStart(2,'0') + '-' + String(date.getDate()).padStart(2,'0');
}

/* 前 7 個完整日（不含今天）；index 0 = 最早的一天 */
function stepWindow(){
  const out = [];
  const wd = ['日','一','二','三','四','五','六'];
  for (let i = 7; i >= 1; i--){
    const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() - i);
    out.push({
      iso: localISO(d),
      label: (d.getMonth()+1) + '/' + d.getDate() + '（' + wd[d.getDay()] + '）',
      weekend: d.getDay() === 0 || d.getDay() === 6
    });
  }
  return out;
}
const WINDOW = stepWindow();

function dateBounds(item){
  const today = new Date(); today.setHours(0,0,0,0);
  const max = new Date(today); max.setDate(max.getDate() - 1);
  const daysBack = Math.max(0, Number(item.days_back) || 0);
  const min = new Date(today); min.setDate(min.getDate() - daysBack);
  return {min:localISO(min), max:localISO(max)};
}

function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return;
    const saved = JSON.parse(raw);
    if(saved && saved.answers){ Object.assign(state, saved); }
  }catch(e){ /* 壞掉就當作新填 */ }
}
let saveTimer = null;
function save(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify({
      answers: state.answers, pageIdx: state.pageIdx, startedAt: state.startedAt, src: state.src
    }));
  }catch(e){}
  const tip = document.getElementById('savedTip');
  tip.classList.add('show');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>tip.classList.remove('show'), 1600);
  updateProgress();
}

/* ===========================================================================
   條件判斷
   =========================================================================== */
function cond(rule, answers = state.answers){
  if(!rule) return true;
  const v = answers[rule.var];
  if('eq' in rule)  return v === rule.eq || String(v) === String(rule.eq);
  if('neq' in rule) return !(v === rule.neq || String(v) === String(rule.neq));
  if('in' in rule)  return rule.in.some(x => x === v || String(x) === String(v));
  if('contains' in rule) return Array.isArray(v) && v.includes(rule.contains);
  if('contains_any' in rule) return Array.isArray(v) && rule.contains_any.some(x => v.includes(x));
  if('gte' in rule) return v !== null && v !== '' && Number.isFinite(Number(v)) && Number(v) >= Number(rule.gte);
  return false;
}
function visibleItems(section, answers = state.answers){
  return (section.items || []).filter(it => cond(it.show_if, answers));
}
function pages(answers = state.answers){
  return (SPEC.sections || []).filter(s => cond(s.show_if, answers)).filter(s => visibleItems(s, answers).length > 0);
}

/* ===========================================================================
   變項命名（矩陣 / 數字群組）
   =========================================================================== */
function matrixVar(item, row){
  if(item.var && item.var.includes('*')) return item.var.replace('*', row.code);
  return row.code;
}
function scaleOf(item){
  if(item.scale && SPEC.meta.scales[item.scale]) return SPEC.meta.scales[item.scale];
  if(item.options_from_scale && SPEC.meta.scales[item.options_from_scale]) return SPEC.meta.scales[item.options_from_scale];
  return item.options || [];
}

function hasAnswer(value){
  if(Array.isArray(value)) return value.length > 0;
  return value !== undefined && value !== null && value !== '';
}
function answerUnits(item){
  if(item.type === 'matrix'){
    return (item.rows||[]).map(row => ({itemId:item.id, key:matrixVar(item,row), seconds:5, kind:'matrix'}));
  }
  if(item.type === 'number_group'){
    return (item.fields||[]).map(field => ({itemId:item.id, key:field.code, seconds:8, kind:'number_group'}));
  }
  if(item.type === 'steps7'){
    return WINDOW.map((_,i) => ({itemId:item.id, key:'steps_d'+(i+1), seconds:8, kind:'steps7'}));
  }
  const seconds = ({single:6, select:6, multi:6, consent:6, number:8, date:8, text:30, textarea:30})[item.type] || 0;
  return [{itemId:item.id, key:item.var, seconds, kind:item.type}];
}
function itemAnswered(item, answers = state.answers){
  const units = answerUnits(item);
  return units.length > 0 && units.every(unit => hasAnswer(answers[unit.key]));
}
function remainingSeconds(spec = SPEC, answers = state.answers){
  if(!spec) return 0;
  let seconds = 0;
  (spec.sections||[]).forEach(section=>{
    if(!cond(section.show_if, answers)) return;
    visibleItems(section, answers).forEach(item=>{
      answerUnits(item).forEach(unit=>{
        if(!hasAnswer(answers[unit.key])) seconds += unit.seconds;
      });
    });
  });
  return seconds;
}
function updateProgress(){
  if(!SPEC || state.finished) return;
  const seconds = remainingSeconds(SPEC, state.answers);
  const minutes = Math.round(seconds / 60);
  const list = pages();
  const segments = Math.max(1, list.length-1);
  const fraction = state.pageIdx / segments;
  setTrailProgress(fraction, segments, Math.min(state.pageIdx,segments));
  const step = document.getElementById('barStep');
  step.textContent = minutes > 0 ? `還剩約 ${minutes} 分鐘` : '快好了';
  step.setAttribute('aria-label', `第 ${state.pageIdx+1} 頁，共 ${list.length} 頁；${step.textContent}`);
}

/* ===========================================================================
   渲染
   =========================================================================== */
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function mdInline(s){
  return esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
}

function formatSubmittedDate(value){
  const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value || '');
  return match ? `${Number(match[2])} 月 ${Number(match[3])} 日` : '';
}
function repeatDevicePromptHtml(){
  if(state.pageIdx !== 0 || !state.repeatDeviceDate || state.repeatPromptDismissed || state.repeatPromptStopped) return '';
  return `<aside class="repeat-device-card" id="repeatDevicePrompt" role="region" aria-label="重複填答提醒">
    <p>這台裝置在 ${esc(formatSubmittedDate(state.repeatDeviceDate))}已經送出過一次了。如果是家人或朋友要填，請繼續；如果是你自己，就不用再填一次囉。</p>
    <div class="repeat-device-actions">
      <button class="btn-primary" id="btnRepeatContinue" type="button">還是要填</button>
      <button class="btn-ghost" id="btnRepeatDone" type="button">我已經填過了</button>
    </div>
  </aside>`;
}

function sliderHtml(item, field = null){
  const variable = field?.code || item.var;
  const minimum = Number(field?.min ?? item.min ?? 0);
  const maximum = Number(field?.max ?? item.max ?? 100);
  const stepSize = Number(field?.step ?? item.step ?? 1) || 1;
  const unit = field?.unit ?? item.unit ?? '';
  const current = state.answers[variable];
  const answered = hasAnswer(current) && Number.isFinite(Number(current));
  const visualValue = answered ? Number(current) : minimum;
  const progress = answered && maximum > minimum
    ? Math.max(0,Math.min(100,(visualValue-minimum)/(maximum-minimum)*100))
    : 0;
  const controlId = 'slider-direct-' + String(variable).replace(/[^a-zA-Z0-9_-]/g,'-');
  const ariaLabel = field?.label || item.stem || variable;
  const readout = `<div class="slider-readout" aria-live="polite">
      <span class="slider-value${answered?'':' is-empty'}" data-slider-display>${answered?esc(current):'—'}</span>
      ${unit?`<span class="unit">${esc(unit)}</span>`:''}
    </div>`;
  const directToggle = `<button class="slider-direct-toggle" type="button" data-slider-toggle aria-expanded="false" aria-controls="${controlId}">直接輸入</button>`;
  return `<div class="slider-widget" data-slider-widget="${esc(variable)}">
    ${field
      ? `<div class="slider-head slider-head--group"><span class="ngroup-label">${mdInline(field.label)}</span>${readout}</div>`
      : `<div class="slider-head">${readout}${directToggle}</div>`}
    <div class="slider-control">
      <input class="range-slider${answered?' is-set':''}" type="range" data-slider data-var="${esc(variable)}"
        min="${minimum}" max="${maximum}" step="${stepSize}" value="${esc(visualValue)}"
        style="--range-progress:${progress.toFixed(2)}%" aria-label="${esc(ariaLabel)}"
        aria-valuetext="${answered?`${esc(current)} ${esc(unit)}`:'尚未作答'}">
      <div class="slider-bounds" aria-hidden="true"><span>${minimum}</span><span>${maximum}</span></div>
    </div>
    ${field?`<div class="slider-utilities">${directToggle}</div>`:''}
    <div class="slider-direct hidden" id="${controlId}" data-slider-direct-wrap>
      <input type="number" inputmode="numeric" data-slider-direct data-var="${esc(variable)}"
        min="${minimum}" max="${maximum}" step="${stepSize}" value="${answered?esc(current):''}" placeholder="請填數字" aria-label="${esc(ariaLabel)}（直接輸入）">
      ${unit?`<span class="unit">${esc(unit)}</span>`:''}
    </div>
  </div>`;
}

function renderItem(item, cardIndex = 0){
  const optionalTag = item.required ? '' : '<span class="q-optional">可跳過</span>';
  const head = `<div class="q-stem">${mdInline(item.stem)}${optionalTag}</div>` +
               (item.help ? `<div class="q-help">${mdInline(item.help)}</div>` : '');
  const wrap = body => `<section class="q" data-item="${item.id}" data-type="${item.type}" style="--card-order:${Math.min(cardIndex,4)}">${head}${body}<div class="err">這一題還沒填</div></section>`;

  switch(item.type){
    case 'consent': {
      const body = `<div style="margin-top:10px">${item.body.split('\n\n').map(p=>`<p>${mdInline(p)}</p>`).join('')}</div>`;
      /* 同意聲明本身當題幹，選項只放「我同意」，避免同一句話出現兩次 */
      return `<div class="consent-body">${body}</div>` + wrap(radioList(item, [{code:1, label:'我同意，開始填答'}]));
    }
    case 'single':
      return wrap(radioList(item, scaleOf(item)));
    case 'multi':
      return wrap(checkList(item, item.options || []));
    case 'select': {
      const opts = item.options_source === 'taiwan_cities'
        ? TAIWAN_CITIES.map(c => ({code:c, label:c}))
        : (item.options || []);
      const cur = state.answers[item.var];
      return wrap(`<div class="field"><select data-var="${item.var}">
        <option value="">請選擇…</option>
        ${opts.map(o=>`<option value="${esc(o.code)}" ${String(cur)===String(o.code)?'selected':''}>${esc(o.label)}</option>`).join('')}
      </select></div>`);
    }
    case 'number': {
      if(sliderVariable(item)) return wrap(sliderHtml(item));
      const cur = state.answers[item.var] ?? '';
      return wrap(`<div class="field">
        <input type="number" inputmode="numeric" data-var="${item.var}"
          ${item.min!=null?`min="${item.min}"`:''} ${item.max!=null?`max="${item.max}"`:''}
          value="${esc(cur)}" placeholder="請填數字">
        ${item.unit?`<span class="unit">${esc(item.unit)}</span>`:''}
      </div>`);
    }
    case 'date': {
      const cur = state.answers[item.var] ?? '';
      const bounds = dateBounds(item);
      return wrap(`<div class="field">
        <input type="date" data-var="${item.var}" min="${bounds.min}" max="${bounds.max}" value="${esc(cur)}">
      </div>`);
    }
    case 'number_group': {
      const rows = (item.fields||[]).map(f=>{
        const cur = state.answers[f.code] ?? '';
        if(sliderVariable(item,f)){
          return `<div class="ngroup-row has-slider" data-answer-var="${esc(f.code)}">
            ${sliderHtml(item,f)}
          </div>`;
        }
        return `<div class="ngroup-row" data-answer-var="${esc(f.code)}">
          <span class="ngroup-label">${mdInline(f.label)}</span>
          <input type="number" inputmode="numeric" data-var="${f.code}"
            ${f.min!=null?`min="${f.min}"`:''} ${f.max!=null?`max="${f.max}"`:''} value="${esc(cur)}" placeholder="0">
          <span class="unit">${esc(f.unit||'')}</span>
        </div>`;
      }).join('');
      return wrap(`<div class="ngroup">${rows}</div>`);
    }
    case 'matrix': {
      const sc = scaleOf(item);
      const rows = (item.rows||[]).map(r=>{
        const v = matrixVar(item, r);
        const cur = state.answers[v];
        const chips = sc.map(o=>`<button type="button" class="chip ${String(cur)===String(o.code)?'on':''}"
            data-var="${v}" data-val="${esc(o.code)}">${esc(o.label)}</button>`).join('');
        return `<div class="mrow" data-answer-var="${esc(v)}"><div class="mrow-label">${mdInline(r.label)}</div><div class="chips">${chips}</div></div>`;
      }).join('');
      return wrap(rows);
    }
    case 'steps7': {
      const stepsComplete = WINDOW.every((_,i)=>hasAnswer(state.answers['steps_d'+(i+1)]));
      const rows = WINDOW.map((d,i)=>{
        const v = 'steps_d' + (i+1);
        const cur = state.answers[v] ?? '';
        return `<div class="steprow ${d.weekend?'weekend':''}" data-answer-var="${v}">
          <span class="stepdate">${d.label}</span>
          <input type="number" inputmode="numeric" enterkeyhint="next" min="0" max="60000" data-var="${v}" data-step-index="${i}" value="${esc(cur)}" placeholder="—">
          <span class="stepunit">步</span>
        </div>`;
      }).join('');
      return wrap(`<span class="steps-complete-badge${stepsComplete?' is-visible':''}" data-steps-badge role="status" aria-live="polite" aria-hidden="${stepsComplete?'false':'true'}">7/7 ✓</span>
        <div class="steps-lookup">找不到逐日數字？iPhone：健康 →「步數」→ 點週檢視；Android：Google Fit 首頁往下捲。</div>
        <div class="steps">${rows}</div>
        <div class="steptip">不確定的那天留空就好，我們容許缺幾天。<br>平均值由我們自己算，<strong>不用你心算</strong>。</div>`);
    }
    case 'text':
      return wrap(`<div class="field"><input type="text" data-var="${item.var}" value="${esc(state.answers[item.var]??'')}" placeholder="（選填）"></div>`);
    case 'textarea':
      return wrap(`<div class="field"><textarea data-var="${item.var}" placeholder="（選填）">${esc(state.answers[item.var]??'')}</textarea></div>`);
    default:
      return wrap(`<div class="q-help">（未知題型：${esc(item.type)}）</div>`);
  }
}

function radioList(item, opts, isConsent){
  const cur = state.answers[item.var];
  return `<div class="opts">` + opts.map(o=>`
    <label class="opt ${String(cur)===String(o.code)?'on':''}">
      <input type="radio" name="${item.var}" value="${esc(o.code)}" data-var="${item.var}" ${String(cur)===String(o.code)?'checked':''}>
      <span class="dot"></span>${optionIcon(item.var,o.code)}<span class="opt-label">${mdInline(o.label)}</span>
    </label>`).join('') + `</div>`;
}
function checkList(item, opts){
  const cur = state.answers[item.var] || [];
  return `<div class="opts">` + opts.map(o=>`
    <label class="opt multi ${cur.includes(String(o.code))?'on':''}">
      <input type="checkbox" name="${item.var}" value="${esc(o.code)}" data-var="${item.var}" data-multi="1" ${cur.includes(String(o.code))?'checked':''}>
      <span class="dot"></span>${optionIcon(item.var,o.code)}<span class="opt-label">${mdInline(o.label)}</span>
    </label>`).join('') + `</div>`;
}

function setNextButtonLabel(label){
  const button = document.getElementById('btnNext');
  const target = button?.querySelector('[data-btn-label]');
  if(target) target.textContent = label;
  else if(button) button.textContent = label;
}

function renderPage({animateCards = true, scrollToTop = true} = {}){
  cancelAutoAdvance();
  const list = pages();
  const total = list.length;
  state.pageIdx = Math.max(0, Math.min(state.pageIdx, total-1));
  const s = list[state.pageIdx];
  const items = visibleItems(s);

  updateProgress();

  document.getElementById('main').innerHTML = `<div class="page${animateCards?' page-enter':''}">
    ${repeatDevicePromptHtml()}
    <h2>${esc(s.title)}</h2>
    ${s.page_note ? `<div class="note">${mdInline(s.page_note)}</div>` : ''}
    ${items.map(renderItem).join('')}
  </div>`;

  document.getElementById('btnBack').classList.toggle('hidden', state.pageIdx === 0);
  setNextButtonLabel((state.pageIdx === total-1) ? '送出問卷' : '下一頁');
  if(scrollToTop) window.scrollTo({top:0, behavior:'auto'});
  bind();
}

/* ===========================================================================
   互動
   =========================================================================== */
function itemById(itemId){
  for(const section of (SPEC.sections||[])){
    const found = (section.items||[]).find(item => item.id === itemId);
    if(found) return found;
  }
  return null;
}
function currentSection(){
  return pages()[state.pageIdx] || null;
}
function prefersReducedMotion(){
  return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}
function clearAdvanceHighlight(){
  clearTimeout(advanceHighlightTimer);
  advanceHighlightTimer = null;
  document.querySelectorAll('.advance-target').forEach(el=>el.classList.remove('advance-target'));
}
function cancelAutoAdvance(){
  clearTimeout(autoAdvanceTimer);
  autoAdvanceTimer = null;
  document.getElementById('btnNext')?.classList.remove('auto-pulse','ready-pulse');
  clearAdvanceHighlight();
}
function currentAnswerUnits(){
  const section = currentSection();
  return section ? visibleItems(section).flatMap(answerUnits) : [];
}
function nextUnansweredUnit(sourceKey){
  const units = currentAnswerUnits();
  const sourceIndex = units.findIndex(unit => unit.key === sourceKey);
  const after = units.slice(sourceIndex + 1).find(unit => !hasAnswer(state.answers[unit.key]));
  return after || units.slice(0, Math.max(0, sourceIndex + 1)).find(unit => !hasAnswer(state.answers[unit.key])) || null;
}
function targetForUnit(unit){
  if(unit.kind === 'matrix'){
    return Array.from(document.querySelectorAll('.mrow[data-answer-var]')).find(el => el.dataset.answerVar === unit.key) || null;
  }
  return Array.from(document.querySelectorAll('.q[data-item]')).find(el => el.dataset.item === unit.itemId) || null;
}
function revealAnswerUnit(unit){
  const target = targetForUnit(unit);
  if(!target) return;
  clearAdvanceHighlight();
  target.classList.add('advance-target');
  target.scrollIntoView({behavior:prefersReducedMotion()?'auto':'smooth', block:'center'});
  advanceHighlightTimer = setTimeout(()=>target.classList.remove('advance-target'), 1100);
}
function pageRequiredComplete(){
  const section = currentSection();
  return !!section && visibleItems(section).filter(item => item.required).every(item => itemAnswered(item));
}
function pageAllAnswered(){
  const section = currentSection();
  const items = section ? visibleItems(section) : [];
  return items.length > 0 && items.every(item => itemAnswered(item));
}
function pulseNextIfNewlyComplete(wasComplete){
  if(wasComplete || !pageAllAnswered()) return;
  const button = document.getElementById('btnNext');
  if(!button || button.disabled || prefersReducedMotion()) return;
  button.classList.remove('ready-pulse');
  void button.offsetWidth;
  button.classList.add('ready-pulse');
  setTimeout(()=>button.classList.remove('ready-pulse'),420);
}
function animateSelectedChoice(varName, value){
  if(prefersReducedMotion()) return;
  const control = Array.from(document.querySelectorAll('.opt input,.chip')).find(element =>
    element.dataset.var === String(varName) &&
    String(element.classList.contains('chip') ? element.dataset.val : element.value) === String(value)
  );
  const target = control?.classList.contains('chip') ? control : control?.closest('.opt');
  if(!target) return;
  target.classList.remove('just-selected');
  void target.offsetWidth;
  target.classList.add('just-selected');
  setTimeout(()=>target.classList.remove('just-selected'),220);
}
function updateStepsCompletionBadge(){
  const badge = document.querySelector('[data-steps-badge]');
  if(!badge) return;
  const complete = WINDOW.every((_,index)=>hasAnswer(state.answers['steps_d'+(index+1)]));
  badge.classList.toggle('is-visible',complete);
  badge.setAttribute('aria-hidden',complete?'false':'true');
}
function scheduleAutoAdvance(item, sourceKey){
  cancelAutoAdvance();
  if(!CONFIG.autoAdvance || !item || !['single','matrix'].includes(item.type)) return;
  const section = currentSection();
  /* 同意聲明所在頁完全不自動前進；終止選項也留給使用者再次確認。 */
  if(!section || visibleItems(section).some(visible => visible.type === 'consent')) return;
  if(item.terminate_if && cond(item.terminate_if)) return;

  const pageAtSchedule = state.pageIdx;
  const unanswered = nextUnansweredUnit(sourceKey);
  if(unanswered){
    autoAdvanceTimer = setTimeout(()=>{
      autoAdvanceTimer = null;
      if(state.pageIdx === pageAtSchedule) revealAnswerUnit(nextUnansweredUnit(sourceKey) || unanswered);
    }, AUTO_ADVANCE_DELAY);
    return;
  }

  if(!pageRequiredComplete() || state.pageIdx >= pages().length - 1) return;
  const btn = document.getElementById('btnNext');
  btn.classList.add('auto-pulse');
  autoAdvanceTimer = setTimeout(()=>{
    autoAdvanceTimer = null;
    btn.classList.remove('auto-pulse');
    if(state.pageIdx !== pageAtSchedule) return;
    const stillUnanswered = nextUnansweredUnit(sourceKey);
    if(stillUnanswered){ revealAnswerUnit(stillUnanswered); return; }
    if(pageRequiredComplete()) btn.click();
  }, AUTO_ADVANCE_DELAY);
}

function sliderPointerValue(range, event){
  const minimum = Number(range.min), maximum = Number(range.max), stepSize = Number(range.step) || 1;
  const rect = range.getBoundingClientRect();
  if(!rect.width || !Number.isFinite(Number(event.clientX))) return Number(range.value);
  const ratio = Math.max(0,Math.min(1,(Number(event.clientX)-rect.left)/rect.width));
  const stepCount = Math.round((minimum + ratio*(maximum-minimum) - minimum)/stepSize);
  return Math.max(minimum,Math.min(maximum,Number((minimum+stepCount*stepSize).toFixed(10))));
}
function syncSliderWidget(range, value, answered){
  const widget = range.closest('[data-slider-widget]');
  if(!widget) return;
  const minimum = Number(range.min), maximum = Number(range.max);
  const numeric = Number(value);
  if(answered && Number.isFinite(numeric)) range.value = String(numeric);
  else range.value = String(minimum);
  const visualValue = Number(range.value);
  const progress = answered && maximum > minimum
    ? Math.max(0,Math.min(100,(visualValue-minimum)/(maximum-minimum)*100))
    : 0;
  range.style.setProperty('--range-progress',progress.toFixed(2)+'%');
  range.classList.toggle('is-set',answered);
  const display = widget.querySelector('[data-slider-display]');
  if(display){
    display.textContent = answered ? String(value) : '—';
    display.classList.toggle('is-empty',!answered);
  }
  const unit = widget.querySelector('.slider-readout .unit')?.textContent || '';
  range.setAttribute('aria-valuetext',answered ? `${value} ${unit}`.trim() : '尚未作答');
  const direct = widget.querySelector('[data-slider-direct]');
  if(direct && document.activeElement !== direct) direct.value = answered ? String(value) : '';
}
function writeSliderAnswer(range, value, answered, wasComplete){
  const variable = range.dataset.var;
  if(answered && Number.isFinite(Number(value))){
    state.answers[variable] = Number(value);
    syncSliderWidget(range,Number(value),true);
  }else{
    state.answers[variable] = null;
    syncSliderWidget(range,null,false);
  }
  range.closest('.q')?.classList.remove('invalid');
  save();
  pulseNextIfNewlyComplete(wasComplete);
}
function bindSliders(){
  document.querySelectorAll('[data-slider-widget]').forEach(widget=>{
    const range = widget.querySelector('[data-slider]');
    const direct = widget.querySelector('[data-slider-direct]');
    const directWrap = widget.querySelector('[data-slider-direct-wrap]');
    widget.querySelector('[data-slider-toggle]')?.addEventListener('click',event=>{
      const button = event.currentTarget;
      const willOpen = directWrap.classList.contains('hidden');
      directWrap.classList.toggle('hidden',!willOpen);
      button.setAttribute('aria-expanded',willOpen?'true':'false');
      if(willOpen) requestAnimationFrame(()=>direct?.focus());
    });
    if(!range) return;
    range.addEventListener('pointerdown',event=>{
      if(event.button != null && event.button !== 0) return;
      const wasComplete = pageAllAnswered();
      const value = sliderPointerValue(range,event);
      range.value = String(value);
      writeSliderAnswer(range,value,true,wasComplete);
    });
    range.addEventListener('input',()=>{
      const wasComplete = pageAllAnswered();
      writeSliderAnswer(range,Number(range.value),true,wasComplete);
    });
    range.addEventListener('keydown',event=>{
      if(hasAnswer(state.answers[range.dataset.var])) return;
      const firstKeys = ['ArrowLeft','ArrowDown','ArrowRight','ArrowUp','Home','End','PageDown','PageUp'];
      if(!firstKeys.includes(event.key)) return;
      event.preventDefault();
      const minimum = Number(range.min), maximum = Number(range.max), stepSize = Number(range.step) || 1;
      let value = minimum;
      if(event.key === 'End') value = maximum;
      if(['ArrowRight','ArrowUp','PageUp'].includes(event.key)) value = Math.min(maximum,minimum+stepSize);
      range.value = String(value);
      writeSliderAnswer(range,value,true,pageAllAnswered());
    });
    direct?.addEventListener('input',()=>{
      const wasComplete = pageAllAnswered();
      const raw = direct.value;
      const number = Number(raw);
      const stepSize = Number(range.step) || 1;
      const stepOffset = (number-Number(range.min))/stepSize;
      const onStep = Math.abs(stepOffset-Math.round(stepOffset)) < 1e-9;
      const inRange = raw !== '' && Number.isFinite(number) && number >= Number(range.min) &&
        number <= Number(range.max) && onStep;
      if(raw === '' || inRange){
        writeSliderAnswer(range,number,inRange,wasComplete);
      }else{
        state.answers[range.dataset.var] = null;
        syncSliderWidget(range,null,false);
        direct.value = raw;
        save();
      }
    });
  });
}

function bind(){
  bindRepeatDevicePrompt();
  bindSliders();
  document.querySelectorAll('input[type=radio]').forEach(el=>{
    el.addEventListener('change', ()=>{
      cancelAutoAdvance();
      const wasComplete = pageAllAnswered();
      const item = itemById(el.closest('.q')?.dataset.item);
      state.answers[el.dataset.var] = isNaN(Number(el.value)) ? el.value : Number(el.value);
      el.closest('.opts').querySelectorAll('.opt').forEach(o=>o.classList.remove('on'));
      el.closest('.opt').classList.add('on');
      el.closest('.q').classList.remove('invalid');
      save();
      if(dependsOnCurrentPage(el.dataset.var)) renderPage({animateCards:false,scrollToTop:false});
      scheduleAutoAdvance(item, el.dataset.var);
      animateSelectedChoice(el.dataset.var,el.value);
      pulseNextIfNewlyComplete(wasComplete);
    });
  });
  document.querySelectorAll('input[type=checkbox]').forEach(el=>{
    el.addEventListener('change', ()=>{
      cancelAutoAdvance();
      const wasComplete = pageAllAnswered();
      const v = el.dataset.var;
      let cur = state.answers[v] || [];
      const val = el.value;
      const selected = el.checked;
      /* 「沒有 / 都沒有 / 沒有養」這類互斥選項：勾了就清掉其他 */
      const exclusive = ['none','沒有養'];
      if(selected){
        cur = exclusive.includes(val) ? [val] : cur.filter(x=>!exclusive.includes(x)).concat([val]);
      }else{
        cur = cur.filter(x=>x!==val);
      }
      state.answers[v] = cur;
      el.closest('.q').classList.remove('invalid');
      save();
      if(dependsOnCurrentPage(v)){
        renderPage({animateCards:false,scrollToTop:false});
      }else{
        el.closest('.opts').querySelectorAll('input[type=checkbox]').forEach(input=>{
          const on = cur.includes(input.value);
          input.checked = on;
          input.closest('.opt').classList.toggle('on',on);
        });
      }
      if(selected && cur.includes(val)) animateSelectedChoice(v,val);
      pulseNextIfNewlyComplete(wasComplete);
    });
  });
  document.querySelectorAll('.chip').forEach(el=>{
    el.addEventListener('click', ()=>{
      cancelAutoAdvance();
      const wasComplete = pageAllAnswered();
      const item = itemById(el.closest('.q')?.dataset.item);
      const v = el.dataset.var, val = el.dataset.val;
      state.answers[v] = isNaN(Number(val)) ? val : Number(val);
      el.parentElement.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
      el.classList.add('on');
      el.closest('.q').classList.remove('invalid');
      save();
      if(dependsOnCurrentPage(v)) renderPage({animateCards:false,scrollToTop:false});
      scheduleAutoAdvance(item, v);
      animateSelectedChoice(v,val);
      pulseNextIfNewlyComplete(wasComplete);
    });
  });
  document.querySelectorAll('input[type=number]:not([data-slider-direct]), input[type=text], input[type=date], textarea, select').forEach(el=>{
    el.addEventListener('input', ()=>{
      cancelAutoAdvance();
      const wasComplete = pageAllAnswered();
      const raw = el.value;
      state.answers[el.dataset.var] = (el.type === 'number')
        ? (raw === '' ? null : Number(raw))
        : raw;
      el.closest('.q')?.classList.remove('invalid');
      updateStepsCompletionBadge();
      save();
      pulseNextIfNewlyComplete(wasComplete);
    });
    el.addEventListener('change', ()=>{
      if(dependsOnCurrentPage(el.dataset.var)) renderPage({animateCards:false,scrollToTop:false});
    });
  });
  document.querySelectorAll('input[data-step-index]').forEach(el=>{
    el.addEventListener('keydown', event=>{
      if(event.key !== 'Enter') return;
      event.preventDefault();
      const next = document.querySelector(`input[data-step-index="${Number(el.dataset.stepIndex)+1}"]`);
      (next || document.getElementById('btnNext')).focus();
    });
  });
}

/* 這一頁有沒有題目的顯示條件依賴這個變項？有就要重畫 */
function dependsOnCurrentPage(varName){
  return (SPEC.sections||[]).some(s =>
    (s.show_if && s.show_if.var === varName) ||
    (s.items||[]).some(it => it.show_if && it.show_if.var === varName)
  );
}

function validatePage(){
  const list = pages();
  const s = list[state.pageIdx];
  let ok = true, firstBad = null;
  visibleItems(s).forEach(item=>{
    if(!item.required) return;
    const el = document.querySelector(`.q[data-item="${item.id}"]`);
    const filled = itemAnswered(item);
    if(!filled){ ok = false; el?.classList.add('invalid'); firstBad = firstBad || el; }
  });
  if(firstBad) firstBad.scrollIntoView({behavior:prefersReducedMotion()?'auto':'smooth', block:'center'});
  return ok;
}

function checkTerminate(){
  for(const s of pages()){
    for(const it of visibleItems(s)){
      if(it.terminate_if && cond(it.terminate_if)) return it.terminate_message || '感謝你的參與。';
    }
  }
  return null;
}

/* ===========================================================================
   結果卡：只衍生顯示值，不寫回 answers / payload
   =========================================================================== */
const CHARACTER_COVARIATES = new Set(['walks_dog','play_social','commute_mode','greenspace','urbanicity']);
const BADGE_COVARIATES = new Set([...CHARACTER_COVARIATES,'pet_type','walkability']);
const MAX_VALID_DAILY_STEPS = 40000;

function finiteAnswer(value){
  if(value === undefined || value === null || value === '') return null;
  const number = Number(value);
  return Number.isFinite(number) ? number : null;
}
function average(values){
  return values.length ? values.reduce((sum,value)=>sum+value,0) / values.length : null;
}
function selectResultCharacter(resultCard, answers){
  const rule = (resultCard?.character_rules||[]).find(candidate =>
    CHARACTER_COVARIATES.has(candidate?.when?.var) && cond(candidate.when, answers)
  ) || null;
  return {
    character:rule || resultCard?.default_character || null,
    rule
  };
}
function characterRuleVariables(characterRule, spec = SPEC){
  const first = characterRule?.when?.var;
  const variables = new Set(first ? [first] : []);
  let changed = true;
  while(changed){
    changed = false;
    (spec?.sections||[]).forEach(section=>{
      (section.items||[]).forEach(item=>{
        if(!variables.has(item.var)) return;
        [section.show_if,item.show_if].forEach(rule=>{
          if(rule?.var && !variables.has(rule.var)){
            variables.add(rule.var);
            changed = true;
          }
        });
      });
    });
  }
  return variables;
}
function selectResultBadges(resultCard, answers, characterRule, spec = SPEC){
  const usedVariables = characterRuleVariables(characterRule, spec);
  const maximum = Math.max(0, Math.floor(Number(resultCard?.max_badges) || 0));
  return (resultCard?.badges||[])
    .filter(badge=>BADGE_COVARIATES.has(badge?.when?.var))
    .filter(badge=>cond(badge.when, answers))
    /* walks_dog 是由 pet_type=dog 才顯示；追溯題目條件才能一併消除這種語意重複。 */
    .filter(badge=>!usedVariables.has(badge.when.var))
    .slice(0, maximum);
}
function deriveStepCardMetrics(stepCard, answers, days = WINDOW){
  const variables = stepCard?.sparkline?.vars || [];
  const points = variables.map((variable,index)=>{
    const raw = finiteAnswer(answers[variable]);
    const value = raw !== null && raw >= 0 && raw <= MAX_VALID_DAILY_STEPS ? raw : null;
    const day = days[index] || {};
    return {
      index,
      variable,
      value,
      iso:day.iso || '',
      label:day.label || `第 ${index+1} 天`
    };
  });
  const validPoints = points.filter(point=>point.value !== null);
  const maxPoint = validPoints.reduce(
    (best,point)=>!best || point.value > best.value ? point : best,
    null
  );
  return {
    steps_mean:average(validPoints.map(point=>point.value)),
    steps_valid_days:validPoints.length,
    steps_max_day_value:maxPoint?.value ?? null,
    steps_max_day_date:maxPoint?.label ?? '',
    sparkline_points:points
  };
}
function shouldShowStepCard(stepCard, metrics){
  const threshold = Math.max(0, Number(stepCard?.show_if_valid_days_at_least) || 0);
  return finiteAnswer(metrics?.steps_valid_days) >= threshold;
}
function resultNumber(value){
  return new Intl.NumberFormat('zh-TW',{maximumFractionDigits:0}).format(Math.round(value));
}
/* 回傳 {num, unit, sub}，讓數字、單位、日期分三層排版，避免「8,150步／天」硬斷行 */
function stepStatParts(stat, metrics){
  const value = finiteAnswer(metrics[stat.var]);
  if(value === null) return null;
  return {
    num: resultNumber(value),
    unit: stat.unit || '',
    sub: stat.with_date_var ? (metrics[stat.with_date_var] || '') : ''
  };
}
function buildStepSparkline(points){
  const width = 560, height = 150, padX = 18, padY = 18;
  const valid = (points||[]).filter(point=>point.value !== null);
  if(valid.length < 1) return '';
  const values = valid.map(point=>point.value);
  const minimum = Math.min(...values), maximum = Math.max(...values);
  const span = maximum - minimum;
  const positioned = (points||[]).map((point,index)=>{
    const x = points.length <= 1
      ? width / 2
      : padX + index * (width - 2*padX) / (points.length - 1);
    const y = point.value === null
      ? null
      : (span === 0
        ? height / 2
        : padY + (maximum - point.value) * (height - 2*padY) / span);
    return {...point,x,y};
  });
  const segments = [];
  let segment = [];
  positioned.forEach(point=>{
    if(point.value === null){
      if(segment.length) segments.push(segment);
      segment = [];
    }else{
      segment.push(point);
    }
  });
  if(segment.length) segments.push(segment);
  const lineHtml = segments.filter(part=>part.length > 1).map(part=>
    `<polyline class="result-spark-line" points="${part.map(point=>`${point.x.toFixed(1)},${point.y.toFixed(1)}`).join(' ')}"></polyline>`
  ).join('');
  const highest = positioned.filter(point=>point.value !== null).reduce(
    (best,point)=>!best || point.value > best.value ? point : best,
    null
  );
  const pointHtml = positioned.filter(point=>point.value !== null).map(point=>{
    const highestClass = point === highest ? ' result-spark-max-ring' : '';
    const radius = point === highest ? 6 : 3.5;
    return `<circle class="result-spark-point${highestClass}" cx="${point.x.toFixed(1)}" cy="${point.y.toFixed(1)}" r="${radius}"><title>${esc(point.label)}：${esc(resultNumber(point.value))} 步</title></circle>`;
  }).join('');
  return `<div class="result-spark-wrap"><svg class="result-sparkline" viewBox="0 0 ${width} ${height}" role="img" aria-label="七日步數折線圖；缺值處中斷，較大的圓圈是最高點">
    <line class="result-spark-guide" x1="${padX}" y1="${height-padY}" x2="${width-padX}" y2="${height-padY}"></line>
    ${lineHtml}${pointHtml}
  </svg></div>`;
}
function buildStepCard(stepCard, metrics){
  if(!stepCard || !shouldShowStepCard(stepCard, metrics)) return '';
  const statsHtml = `<div class="result-stats">${(stepCard.stats||[]).map(stat=>{
    const parts = stepStatParts(stat, metrics);
    if(!parts) return '';
    return `<div class="result-stat">
      <span class="result-stat-label">${mdInline(stat.label)}</span>
      <span class="result-stat-value">${esc(parts.num)}<span class="result-stat-unit">${esc(parts.unit)}</span></span>
      ${parts.sub ? `<span class="result-stat-sub">${esc(parts.sub)}</span>` : ''}
    </div>`;
  }).join('')}</div>`;
  return `<section class="result-step-card result-reveal-last">
    <h3>${mdInline(stepCard.title)}</h3>
    ${stepCard.note ? `<p class="result-step-note">${mdInline(stepCard.note)}</p>` : ''}
    ${statsHtml}${buildStepSparkline(metrics.sparkline_points)}
  </section>`;
}

function decodedShareValue(value){
  const text = String(value ?? '');
  try{ return decodeURIComponent(text); }

/* 分享物的安全檢查。
   ⚠️ 數字檢查只能套在「文案」上，不能套在網址上——網址本來就可能有數字
      （port、網域裡的數字、之後換成短網址都是），把網址算進去會誤殺正常輸出。
   遊戲名檢查則兩者都要查。
   values 可以傳 {text:[...], url:'...'}，也可以傳舊的陣列／物件（那時整包都當文案查）。 */
function publicShareSafetyIssue(values){
  let textParts, urlParts;
  if(values && !Array.isArray(values) && ('text' in values || 'url' in values)){
    textParts = [].concat(values.text ?? []);
    urlParts  = [].concat(values.url ?? []);
  }else{
    const list = Array.isArray(values) ? values : Object.values(values || {});
    textParts = list.flat(Infinity);
    urlParts  = [];
  }
  const asString = parts => parts.flat(Infinity).map(v=>String(v ?? '')).join('\n');
  const textPlain = asString(textParts);
  const textSearchable = `${textPlain}\n${decodedShareValue(textPlain)}`;
  if(/[0-9０-９]/u.test(textSearchable)) return '分享內容含有數字';

  const allPlain = `${textPlain}\n${asString(urlParts)}`;
  const folded = `${allPlain}\n${decodedShareValue(allPlain)}`.toLocaleLowerCase();
  if(SHARE_FORBIDDEN_GAME_NAMES.some(name=>folded.includes(name.toLocaleLowerCase()))){
    return '分享內容含有遊戲名稱';
  }
  return '';
}
