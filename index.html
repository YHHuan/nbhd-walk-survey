    <p>抽獎用<strong>另一個表單</strong>、跟問卷分開存，避免答案和聯絡方式綁在一起。問卷已送出；這步只留領獎聯絡方式，不填也沒關係。</p>
    <a class="btn-lottery" data-lottery-link="full" href="${esc(lotteryUrl)}" target="_blank" rel="noopener noreferrer">還沒登錄抽獎？點這裡</a>
  </div>`;
}
function buildResultCard(answers, lotteryEligible = true){
  const resultCard = SPEC?.meta?.result_card;
  if(!resultCard?.enabled) return {html:'', character:null, resultCard:null};

  const selection = selectResultCharacter(resultCard, answers);
  const character = selection.character;
  const badges = selectResultBadges(resultCard, answers, selection.rule);
  const stepMetrics = deriveStepCardMetrics(resultCard.step_card, answers);
  const badgeHtml = badges.length ? `<div class="result-badges">${badges.map((badge,index)=>`
    <span class="result-badge" style="--badge-index:${index}">${mdInline(badge.label)}</span>`).join('')}</div>` : '';
  const art = character ? (CHARACTER_ART[character.code] || CHARACTER_ART.everyday) : '';
  const characterHtml = character ? `<div class="result-character">
      <div class="result-art-stage">${art}</div>
      <h2 class="result-name"><span>${mdInline(character.name)}</span><span class="result-emoji" aria-hidden="true">${esc(character.emoji)}</span></h2>
      <p class="result-blurb">${mdInline(character.blurb)}</p>
    </div>` : '';
  const shareHtml = character && resultCard.share ? `<button class="result-share" id="btnShare" type="button">存成圖片，分享到 IG／限動</button>
    <p class="result-share-privacy">分享圖上只有你的角色，不會有你的步數或任何答案。</p>
    <p class="result-share-note" id="shareNotice" role="status" aria-live="polite"></p>
    <div class="result-share-preview hidden" id="sharePreview" aria-label="可直接截圖的分享圖片"></div>` : '';

  return {
    character,
    resultCard,
    html:`<section class="result-card is-revealing" style="--badge-count:${badges.length}">${characterHtml}${badgeHtml}${buildLotteryInvite('compact',lotteryEligible)}${buildStepCard(resultCard.step_card,stepMetrics)}
      <div class="result-reveal-last"><div class="result-disclaimer" role="note" aria-label="結果卡免責聲明">${mdInline(resultCard.disclaimer)}</div>${shareHtml}</div></section>`
  };
}
async function copyShareContent(content){
  try{
    if(navigator.clipboard?.writeText){ await navigator.clipboard.writeText(content); return true; }
  }catch(e){}
  const field = document.createElement('textarea');
  field.value = content; field.setAttribute('readonly','');
  field.style.position = 'fixed'; field.style.opacity = '0';
  document.body.appendChild(field); field.select();
  let copied = false;
  try{ copied = document.execCommand('copy'); }catch(e){}
  field.remove();
  return copied;
}
function shareSvgDataUrl(markup){
  const parsed = new DOMParser().parseFromString(String(markup || ''), 'image/svg+xml');
  if(parsed.querySelector('parsererror')) throw new Error('角色插畫格式錯誤');
  const svg = parsed.documentElement;
  svg.setAttribute('xmlns','http://www.w3.org/2000/svg');
  svg.setAttribute('width','960');
  svg.setAttribute('height','720');
  svg.setAttribute('style',`color:${SHARE_IMAGE_COLORS.ink}`);
  const xml = new XMLSerializer().serializeToString(svg);
  return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(xml)}`;
}
function loadShareImage(source){
  return new Promise((resolve,reject)=>{
    const image = new Image();
    image.onload = ()=>resolve(image);
    image.onerror = ()=>reject(new Error('角色插畫載入失敗'));
    image.src = source;
  });
}
function canvasRoundedRect(context, x, y, width, height, radius){
  const r = Math.max(0,Math.min(radius,width/2,height/2));
  context.beginPath();
  context.moveTo(x+r,y);
  context.lineTo(x+width-r,y);
  context.quadraticCurveTo(x+width,y,x+width,y+r);
  context.lineTo(x+width,y+height-r);
  context.quadraticCurveTo(x+width,y+height,x+width-r,y+height);
  context.lineTo(x+r,y+height);
  context.quadraticCurveTo(x,y+height,x,y+height-r);
  context.lineTo(x,y+r);
  context.quadraticCurveTo(x,y,x+r,y);
  context.closePath();
}
function canvasTextLines(context, value, maxWidth, maxLines = Infinity){
  const lines = [];
  String(value || '').split('\n').forEach(paragraph=>{
    if(!paragraph){ lines.push(''); return; }
    let line = '';
    Array.from(paragraph).forEach(character=>{
      const candidate = line + character;
      if(line && context.measureText(candidate).width > maxWidth){
        lines.push(line);
        line = character;
      }else{
        line = candidate;
      }
    });
    if(line) lines.push(line);
  });
  if(lines.length <= maxLines) return lines;
  const visible = lines.slice(0,maxLines);
  let last = visible[visible.length-1];
  while(last && context.measureText(last+'…').width > maxWidth) last = last.slice(0,-1);
  visible[visible.length-1] = last+'…';
  return visible;
}
function drawWrappedCanvasText(context, value, x, y, maxWidth, lineHeight, maxLines = Infinity){
  const lines = canvasTextLines(context,value,maxWidth,maxLines);
  lines.forEach((line,index)=>context.fillText(line,x,y+index*lineHeight));
  return y + lines.length*lineHeight;
}
async function createShareCanvas(resultCard, character, href = location.href){
  const content = shareImageText(resultCard,character,href);
  /* 網址單獨拆出來：數字檢查不查它，遊戲名檢查才查 */
  const {url, ...copy} = content;
  const issue = publicShareSafetyIssue({text:Object.values(copy), url});
  if(issue){
    const error = new Error(issue);
    error.name = 'ShareSafetyError';
    throw error;
  }
  const art = CHARACTER_ART[character?.code];
  if(!art) throw new Error('找不到這個角色的分享插畫');
  const illustration = await loadShareImage(shareSvgDataUrl(art));
  const canvas = document.createElement('canvas');
  canvas.width = SHARE_IMAGE_WIDTH;
  canvas.height = SHARE_IMAGE_HEIGHT;
  const context = canvas.getContext('2d');
  if(!context) throw new Error('這個瀏覽器無法建立分享圖片');

  context.fillStyle = SHARE_IMAGE_COLORS.cream;
  context.fillRect(0,0,SHARE_IMAGE_WIDTH,SHARE_IMAGE_HEIGHT);
  context.fillStyle = SHARE_IMAGE_COLORS.pink;
  context.beginPath(); context.arc(94,112,18,0,Math.PI*2); context.fill();
  context.fillStyle = SHARE_IMAGE_COLORS.clay;
  context.beginPath(); context.arc(986,112,12,0,Math.PI*2); context.fill();

  context.textAlign = 'center';
  context.textBaseline = 'alphabetic';
  context.fillStyle = SHARE_IMAGE_COLORS.ink;
  context.font = '700 38px "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
  context.fillText(content.eyebrow,SHARE_IMAGE_WIDTH/2,155);

  context.fillStyle = SHARE_IMAGE_COLORS.moss;
  canvasRoundedRect(context,82,218,916,704,58); context.fill();
  context.fillStyle = SHARE_IMAGE_COLORS.cream;
  canvasRoundedRect(context,101,237,878,666,44); context.fill();
  context.drawImage(illustration,129,255,822,617);

  context.fillStyle = SHARE_IMAGE_COLORS.ink;
  context.font = '92px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  context.fillText(content.emoji,SHARE_IMAGE_WIDTH/2,1038);
  context.font = '800 78px "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
  context.fillText(content.name,SHARE_IMAGE_WIDTH/2,1147);

  context.fillStyle = SHARE_IMAGE_COLORS.clay;
  canvasRoundedRect(context,460,1195,160,10,5); context.fill();
  context.fillStyle = SHARE_IMAGE_COLORS.ink;
  context.font = '500 42px "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
  drawWrappedCanvasText(context,content.blurb,SHARE_IMAGE_WIDTH/2,1293,820,66,4);

  context.strokeStyle = SHARE_IMAGE_COLORS.moss;
  context.lineWidth = 5;
  context.beginPath(); context.moveTo(145,1570); context.lineTo(935,1570); context.stroke();
  context.fillStyle = SHARE_IMAGE_COLORS.moss;
  context.font = '750 45px "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
  context.fillText(content.cta,SHARE_IMAGE_WIDTH/2,1668);
  context.fillStyle = SHARE_IMAGE_COLORS.ink;
  context.font = '500 29px "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
  drawWrappedCanvasText(context,content.url,SHARE_IMAGE_WIDTH/2,1745,820,44,3);
  return {canvas,content};
}
function canvasPngBlob(canvas){
  if(typeof canvas.toBlob === 'function'){
    return new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
  }
  try{
    const dataUrl = canvas.toDataURL('image/png');
    const encoded = dataUrl.slice(dataUrl.indexOf(',')+1);
    const binary = atob(encoded);
    const bytes = new Uint8Array(binary.length);
    for(let index=0; index<binary.length; index++) bytes[index] = binary.charCodeAt(index);
    return Promise.resolve(new Blob([bytes],{type:'image/png'}));
  }catch(error){ return Promise.resolve(null); }
}
function downloadShareImage(blob){
  if(!blob) return false;
  const anchor = document.createElement('a');
  if(!('download' in anchor)) return false;
  const objectUrl = URL.createObjectURL(blob);
  anchor.href = objectUrl;
  anchor.download = '日常移動角色.png';
  anchor.style.display = 'none';
  document.body.appendChild(anchor);
  try{ anchor.click(); }
  catch(error){ anchor.remove(); URL.revokeObjectURL(objectUrl); return false; }
  anchor.remove();
  setTimeout(()=>URL.revokeObjectURL(objectUrl),1000);
  return true;
}
function canShareResultFile(file){
  if(!file || typeof navigator.share !== 'function') return false;
  if(typeof navigator.canShare !== 'function') return true;
  try{ return navigator.canShare({files:[file]}); }
  catch(error){ return false; }
}
function showSharePreview(canvas){
  const preview = document.getElementById('sharePreview');
  if(!preview) return;
  const prompt = document.createElement('p');
  prompt.textContent = '你的瀏覽器不支援自動存圖，直接截圖這一頁也可以。';
  preview.replaceChildren(prompt,canvas);
  preview.classList.remove('hidden');
}
function setShareNotice(message, isError = false){
  const notice = document.getElementById('shareNotice');
  if(!notice) return;
  notice.textContent = message;
  notice.classList.toggle('is-error',isError);
}
function bindResultShare(resultCard, character){
  const button = document.getElementById('btnShare');
  if(!button || !resultCard?.share || !character) return;
  const original = button.textContent;
  button.addEventListener('click', async()=>{
    const url = shareUrl(resultCard);
    const text = resultShareText(resultCard, character);
    const imageText = shareImageText(resultCard,character,url);
    const {url: imageUrl, ...imageCopy} = imageText;
    const issue = publicShareSafetyIssue({
      text:[...Object.values(imageCopy), text],
      url:[imageUrl, url]
    });
    if(issue){
      setShareNotice(`無法產生分享圖：${issue}，請聯絡研究團隊。`,true);
      return;
    }
    button.disabled = true;
    button.textContent = '產生中…';
    setShareNotice('');
    document.getElementById('sharePreview')?.classList.add('hidden');
    try{
      const {canvas} = await createShareCanvas(resultCard,character,url);
      const blob = await canvasPngBlob(canvas);
      let file = null;
      if(blob && typeof File === 'function'){
        try{ file = new File([blob],'日常移動角色.png',{type:'image/png'}); }
        catch(error){ file = null; }
      }
      if(canShareResultFile(file)){
        try{
          await navigator.share({files:[file],text,url,title:imageText.eyebrow});
          setShareNotice('已開啟分享選單，可以直接傳到 IG、Threads 或 LINE。');
          return;
        }catch(error){
          if(error?.name === 'AbortError') return;
        }
      }
      const downloaded = downloadShareImage(blob);
      const copied = await copyShareContent(`${text}\n${url}`);
      if(downloaded){
        setShareNotice(`圖片已存到你的相簿／下載資料夾，可以直接發到 IG 限動或 Threads。${copied?'分享文字與連結也已複製。':''}`);
      }else{
        showSharePreview(canvas);
        setShareNotice(`你的瀏覽器不支援自動存圖，直接截圖這一頁也可以。${copied?'分享文字與連結已複製。':''}`);
      }
    }catch(error){
      const safetyError = error?.name === 'ShareSafetyError';
      setShareNotice(safetyError ? `無法產生分享圖：${error.message}，請聯絡研究團隊。` : '圖片產生失敗，請稍後再試。',true);
    }finally{
      button.disabled = false;
      button.textContent = original;
    }
  });
}

/* ===========================================================================
   送出
   =========================================================================== */
const STEP_ANSWER_KEYS = Array.from({length:7},(_,index)=>`steps_d${index+1}`);
const EXP_ANSWER_KEYS = Array.from({length:5},(_,index)=>`exp${index+1}`);
const LOTTERY_GATE_REASON = 'duration_sec < 60、步數欄位全空、exp1–exp5 全空';

/* 只建立送出快照，不改動 state.answers。反覆套用條件，讓 L1 → L2 → L3
   這類相依分支在上游隱藏後，殘留的下游答案也會跟著消失。 */
function submissionAnswerSnapshot(spec = SPEC, sourceAnswers = state.answers){
  const answers = {...sourceAnswers};
  const strippedKeys = new Set();
  let changed = false;
  do{
    changed = false;
    (spec?.sections||[]).forEach(section=>{
      const sectionVisible = cond(section.show_if, answers);
      (section.items||[]).forEach(item=>{
        if(sectionVisible && cond(item.show_if, answers)) return;
        answerUnits(item).forEach(unit=>{
          if(!Object.prototype.hasOwnProperty.call(answers,unit.key)) return;
          if(hasAnswer(answers[unit.key])) strippedKeys.add(unit.key);
          delete answers[unit.key];
          changed = true;
        });
      });
    });
  }while(changed);

  const visibleKeys = new Set();
  (spec?.sections||[]).forEach(section=>{
    if(!cond(section.show_if, answers)) return;
    (section.items||[]).forEach(item=>{
      if(!cond(item.show_if, answers)) return;
      answerUnits(item).forEach(unit=>visibleKeys.add(unit.key));
    });
  });
  return {answers, visibleKeys, strippedHiddenAnswers:strippedKeys.size};
}

function lotteryEligibility(durationSec, answers = {}){
  const durationUnder60 = Number.isFinite(Number(durationSec)) && Number(durationSec) < 60;
  const noStepApp = String(answers.step_source) === '0';
  const stepsBlank = noStepApp
    ? !hasAnswer(answers.steps_selfreport)
    : STEP_ANSWER_KEYS.every(key=>!hasAnswer(answers[key]));
  const explorationBlank = EXP_ANSWER_KEYS.every(key=>!hasAnswer(answers[key]));
  const gated = durationUnder60 && stepsBlank && explorationBlank;
  return {
    eligible: !gated,
    reason: gated ? LOTTERY_GATE_REASON : ''
  };
}

function payload(){
  const submitted = new Date();
  const durationSec = Math.round((submitted - new Date(state.startedAt))/1000);
  const snapshot = submissionAnswerSnapshot();
  const lottery = lotteryEligibility(durationSec, snapshot.answers);
  const repeatDevice = state.repeatDevice || state.submittedThisSession || Boolean(readSubmittedDate());
  const stepMap = {};
  WINDOW.forEach((day,index)=>{
    const key = STEP_ANSWER_KEYS[index];
    if(snapshot.visibleKeys.has(key)) stepMap[key] = {date:day.iso, steps:snapshot.answers[key] ?? null};
  });
  const hasVisibleStepDays = Object.keys(stepMap).length > 0;
  /* 既有後端有些只展開 answers；同步鏡射送出 metadata，避免匯出時遺失。 */
  const answers = {
    ...snapshot.answers,
    repeat_device: repeatDevice,
    lottery_eligible: lottery.eligible,
    lottery_gate_reason: lottery.reason,
    stripped_hidden_answers: snapshot.strippedHiddenAnswers
  };
  return {
    spec_version: CONFIG.specVersion,
    src: state.src,
    started_at: state.startedAt,
    submitted_at: submitted.toISOString(),
    duration_sec: durationSec,
    repeat_device: repeatDevice,
    lottery_eligible: lottery.eligible,
    lottery_gate_reason: lottery.reason,
    stripped_hidden_answers: snapshot.strippedHiddenAnswers,
    ...(hasVisibleStepDays ? {
      step_window_start: WINDOW[0].iso,
      step_window_end: WINDOW[6].iso,
      step_days: stepMap
    } : {}),
    answers
  };
}

async function submit(){
  const btn = document.getElementById('btnNext');
  btn.disabled = true; setNextButtonLabel('送出中…');
  const data = payload();
  try{
    if(CONFIG.mode === 'apps_script' && CONFIG.appsScriptUrl){
      await fetch(CONFIG.appsScriptUrl, {
        method:'POST', mode:'no-cors',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify(data)
      });
    }else if(CONFIG.mode === 'supabase' && window.submitToSupabase){
      await window.submitToSupabase(data);
    }
    clearDraft();
    const submittedDate = localISO(new Date(data.submitted_at));
    rememberSubmittedDate(submittedDate);
    state.repeatDevice = true;
    state.repeatDeviceDate = submittedDate;
    state.submittedThisSession = true;
    state.repeatPromptDismissed = true;
    state.finished = true;
    renderDone(data);
  }catch(e){
    btn.disabled = false; setNextButtonLabel('再試一次');
    alert('送出失敗，可能是網路問題。你的答案還存在這台裝置上，稍後再按一次即可。');
  }
}

function renderDone(data){
  cancelAutoAdvance();
  document.getElementById('nav').classList.add('hidden');
  const trailSegments = Math.max(1,pages().length-1);
  setTrailProgress(1,trailSegments,trailSegments);
  document.getElementById('barStep').textContent = '完成';
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const lotteryEligible = data.lottery_eligible !== false;
  const result = buildResultCard(data.answers || {}, lotteryEligible);
  const lotteryBlock = buildLotteryInvite('full', lotteryEligible);
  if(lotteryEligible && !configuredLotteryUrl() && CONFIG.mode !== 'demo'){
    console.error('抽獎連結尚未設定：CONFIG.lotteryUrl 是空字串，正式模式不會顯示抽獎區塊。');
  }
  document.getElementById('main').innerHTML = `
  <div class="page done">
    ${result.html}
    <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#6E8B5B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>
    <h1>填完了，謝謝你</h1>
    <p class="sub">你的回答已經記錄下來。這份研究的結果會做成課程海報，不會出現任何個人資料。</p>

    ${lotteryBlock}

    <p class="fineprint">
      如果對這份研究有疑問，可以聯絡：${esc(CONFIG.studyContact)}<br>
      如果你有朋友也符合條件（18 歲以上、住在台灣），歡迎把連結轉給他們。
    </p>

    ${CONFIG.mode === 'demo' ? `
    <details class="debug" open>
      <summary>【測試模式】這次的資料（正式收案時這一區不會出現）</summary>
      <p style="text-align:left"><a href="${url}" download="survey_demo_${Date.now()}.json">下載這筆 JSON</a></p>
      <pre>${esc(JSON.stringify(data,null,2))}</pre>
    </details>` : ''}
  </div>`;
  bindResultShare(result.resultCard, result.character);
  document.getElementById('btnReturnToSteps')?.addEventListener('click', returnToStepsPage);
}

function returnToStepsPage(){
  const stepIndex = pages().findIndex(section =>
    visibleItems(section).some(item => item.type === 'steps7' || item.var === 'steps_selfreport')
  );
  if(stepIndex < 0) return;
  state.finished = false;
  state.pageIdx = stepIndex;
  document.getElementById('nav').classList.remove('hidden');
  save();
  renderPage();
}

function renderTerminated(msg){
  document.getElementById('nav').classList.add('hidden');
  document.getElementById('main').innerHTML = `<div class="page done">
    <h1>謝謝你</h1><p class="sub">${mdInline(msg)}</p></div>`;
}

function renderRepeatDeviceThanks(){
  cancelAutoAdvance();
  document.getElementById('nav').classList.add('hidden');
  setTrailProgress(0,Math.max(1,pages().length-1),0,false);
  document.getElementById('barStep').textContent = '已填過';
  document.getElementById('main').innerHTML = `<div class="page done">
    <h1>謝謝你已經填過了</h1>
    <p class="sub">你的回答已經收到，不用再填一次。謝謝你的參與！</p>
  </div>`;
}

/* ===========================================================================
   啟動
   =========================================================================== */
document.getElementById('btnNext').addEventListener('click', ()=>{
  cancelAutoAdvance();
  if(!validatePage()) return;
  const stop = checkTerminate();
  if(stop){ clearDraft(); renderTerminated(stop); return; }
  const total = pages().length;
  if(state.pageIdx === total-1){ submit(); return; }
  state.pageIdx++; save(); renderPage();
});
document.getElementById('btnBack').addEventListener('click', ()=>{
  cancelAutoAdvance();
  state.pageIdx = Math.max(0, state.pageIdx-1); save(); renderPage();
});

load();
if(!SPEC){
  document.getElementById('main').innerHTML =
    '<div class="page"><h1>尚未注入問卷內容</h1><p class="sub">請執行 <code>python3 08_內部工具/build_questionnaire.py</code> 產生 02_問卷/web/survey.html。</p></div>';
  document.getElementById('nav').classList.add('hidden');
}else{
  document.getElementById('barTitle').textContent = SPEC.meta.public_title.replace(/^台灣/, '');
  renderPage();
}
